<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試註冊表單</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div style="max-width: 390px; margin: 0 auto; padding: 20px;">
      <h2>測試下拉選單</h2>

      <div class="form-group">
        <label class="form-label">性別</label>
        <select class="form-select" id="test-sex">
          <option value="">性別</option>
          <option value="M">男</option>
          <option value="F">女</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">縣市</label>
        <select class="form-select" id="test-city">
          <option value="">縣市</option>
          <option value="臺北市">臺北市</option>
          <option value="新北市">新北市</option>
          <option value="桃園市">桃園市</option>
          <option value="臺中市">臺中市</option>
          <option value="臺南市">臺南市</option>
          <option value="高雄市">高雄市</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">鄉鎮市區</label>
        <select class="form-select" id="test-district">
          <option value="">鄉鎮市區</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const citySelect = document.getElementById('test-city');
    const districtSelect = document.getElementById('test-district');

    const districts = {
      '臺北市': ['中正區', '大同區', '中山區', '松山區', '大安區', '萬華區', '信義區', '士林區', '北投區', '內湖區', '南港區', '文山區'],
      '新北市': ['板橋區', '三重區', '中和區', '永和區', '新莊區', '新店區', '樹林區', '鶯歌區', '三峽區', '淡水區', '汐止區', '瑞芳區', '土城區', '蘆洲區', '五股區', '泰山區', '林口區', '深坑區', '石碇區', '坪林區', '三芝區', '石門區', '八里區', '平溪區', '雙溪區', '貢寮區', '金山區', '萬里區', '烏來區'],
      '桃園市': ['桃園區', '中壢區', '平鎮區', '八德區', '楊梅區', '蘆竹區', '大溪區', '龍潭區', '龜山區', '大園區', '觀音區', '新屋區', '復興區'],
      '臺中市': ['中區', '東區', '南區', '西區', '北區', '西屯區', '南屯區', '北屯區', '豐原區', '東勢區', '大甲區', '清水區', '沙鹿區', '梧棲區', '后里區', '神岡區', '潭子區', '大雅區', '新社區', '石岡區', '外埔區', '大安區', '烏日區', '大肚區', '龍井區', '霧峰區', '太平區', '大里區', '和平區'],
      '臺南市': ['中西區', '東區', '南區', '北區', '安平區', '安南區', '永康區', '歸仁區', '新化區', '左鎮區', '玉井區', '楠西區', '南化區', '仁德區', '關廟區', '龍崎區', '官田區', '麻豆區', '佳里區', '西港區', '七股區', '將軍區', '學甲區', '北門區', '新營區', '後壁區', '白河區', '東山區', '六甲區', '下營區', '柳營區', '鹽水區', '善化區', '大內區', '山上區', '新市區', '安定區'],
      '高雄市': ['新興區', '前金區', '苓雅區', '鹽埕區', '鼓山區', '旗津區', '前鎮區', '三民區', '楠梓區', '小港區', '左營區', '仁武區', '大社區', '東沙群島', '南沙群島', '岡山區', '路竹區', '阿蓮區', '田寮區', '燕巢區', '橋頭區', '梓官區', '彌陀區', '永安區', '湖內區', '鳳山區', '大寮區', '林園區', '鳥松區', '大樹區', '旗山區', '美濃區', '六龜區', '內門區', '杉林區', '甲仙區', '桃源區', '那瑪夏區', '茂林區', '茄萣區']
    };

    citySelect.addEventListener('change', () => {
      const city = citySelect.value;
      districtSelect.innerHTML = '<option value="">鄉鎮市區</option>';

      console.log('選擇縣市:', city);
      console.log('對應區域:', districts[city]);

      if (city && districts[city]) {
        districts[city].forEach(d => {
          const option = document.createElement('option');
          option.value = d;
          option.textContent = d;
          districtSelect.appendChild(option);
          console.log('新增選項:', d);
        });
      }
    });
  </script>
</body>
</html>
